.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top-actions{display:flex;align-items:center;gap:8px}.control{min-height:40px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:#26272d;border-radius:999px;padding:9px 13px;font-size:12px;text-decoration:none;cursor:pointer;outline:none;white-space:nowrap}.control.primary{background:#111214;color:#fff;border-color:#111214}.control:focus-visible,.archive-link:focus-visible,.toc-link:focus-visible,.source-button:focus-visible{box-shadow:0 0 0 3px rgba(57,110,227,.18),0 0 0 1px rgba(57,110,227,.55);outline:none}.toc-shell{position:sticky;top:45px;z-index:60;margin-bottom:14px;display:none;background:var(--bg)}.toc-shell.visible{display:block}.toc{display:flex;gap:16px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:11px 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px}.toc::-webkit-scrollbar{display:none}.toc-link{position:relative;flex:0 0 auto;color:#858791;text-decoration:none;font-size:10.5px;line-height:1;padding:4px 0}.toc-link.active{color:var(--text)}.toc-link::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left}.toc-link.active::after{transform:scaleX(1)}
.article{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:36px 36px 46px}.article>*{max-width:var(--reading);margin-left:auto;margin-right:auto}.hero-block{padding-bottom:26px;border-bottom:1px solid var(--line)}.kicker{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.dr-badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#111;color:#fff;font-size:9px;font-weight:800;letter-spacing:.04em}.meta{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}.article h1{font-size:clamp(34px,5vw,48px);line-height:1.08;letter-spacing:-1.45px;margin:0 0 12px;text-wrap:balance}.byline{font-size:12px;color:var(--muted);line-height:1.65;margin-top:10px}.themes{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}.reading-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px;color:#8b8d95;font-size:10.5px}.reading-meta .dot{opacity:.45}.source-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding:14px 0 0;border-top:1px solid var(--line)}.source-copy{min-width:0}.source-name{font-size:12px;font-weight:650}.source-access{margin-top:4px;font-size:10px;color:var(--muted);line-height:1.5}.source-button{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:11px;background:var(--soft)}
.section{padding-top:34px;scroll-margin-top:126px}.section h2{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#646670;margin:0 0 14px;font-weight:800}.section h2::before{content:"";display:block;width:18px;height:1px;background:#b9bbc3}.body{font-size:16px;line-height:1.92;color:#25262c;white-space:pre-line;text-wrap:pretty}.deep-read-body{padding-top:34px;font-size:16px;line-height:1.92;color:var(--text);overflow-wrap:anywhere}.deep-read-body>:first-child{margin-top:0}.deep-read-body>:last-child{margin-bottom:0}.deep-read-body h1,.deep-read-body h2,.deep-read-body h3,.deep-read-body h4,.deep-read-body h5,.deep-read-body h6{color:var(--text);text-transform:none;letter-spacing:-.02em;line-height:1.25;font-weight:760;scroll-margin-top:126px}.deep-read-body h1{font-size:30px;margin:44px 0 18px}.deep-read-body h2{font-size:24px;margin:40px 0 16px}.deep-read-body h3{font-size:19px;margin:32px 0 13px}.deep-read-body h4,.deep-read-body h5,.deep-read-body h6{font-size:16px;margin:28px 0 12px}.deep-read-body p{margin:0 0 19px}.deep-read-body strong{font-weight:760;color:var(--text)}.deep-read-body blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:2px solid var(--accent);color:var(--muted)}.deep-read-body blockquote p{margin:0}.deep-read-body ul,.deep-read-body ol{margin:0 0 20px;padding-left:1.45em}.deep-read-body li{margin:7px 0;padding-left:.15em}.deep-read-body pre{margin:24px 0;padding:16px 18px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--soft);font:400 13px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;white-space:pre}.deep-read-body code{font:400 .9em/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;background:var(--soft);border-radius:5px;padding:.1em .35em}.deep-read-body pre code{font:inherit;background:transparent;border-radius:0;padding:0}.deep-read-body a{color:inherit;text-decoration-line:underline;text-decoration-color:var(--line-strong);text-decoration-thickness:1px;text-underline-offset:3px}.deep-read-body hr{border:0;border-top:1px solid var(--line);margin:34px 0}.deep-read-status{margin-top:30px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px;line-height:1.7}.takeaways,.question-list{display:grid;gap:10px}.takeaway,.question{background:#f5f6f8;border:1px solid #eceef2;border-radius:14px;padding:16px 18px;line-height:1.75;font-size:15px}.takeaway{display:grid;grid-template-columns:26px 1fr;gap:8px}.takeaway-index{color:var(--muted);font-size:10px;padding-top:4px}.error{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--muted)}
.archive-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.archive-link{display:flex;flex-direction:column;justify-content:space-between;min-height:112px;padding:16px 17px;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:16px;text-decoration:none;outline:none}.archive-link.empty{visibility:hidden}.archive-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#90929a}.archive-title{margin-top:18px;font-size:13px;line-height:1.45;font-weight:650;color:#2c2e35;text-wrap:pretty}.archive-meta{margin-top:7px;font-size:10px;color:var(--muted)}.footerbrand{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:28px;color:#8a8c94;font-size:10px;letter-spacing:.08em}.footerbrand img{width:18px;height:18px}.to-top{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.94);color:#454750;font-size:16px;cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none}.to-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
@keyframes brandIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes markIn{from{transform:scale(.96)}to{transform:scale(1)}}
@media(hover:hover) and (pointer:fine){.collection-link:hover{color:var(--text)}.archive-link:hover{background:#fff;border-color:var(--line-strong)}}
@media(max-width:700px){main{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.brandbar{align-items:center}.mode,.product{display:none}.article{padding:28px 20px 38px;border-radius:20px}.topbar{align-items:flex-start}.top-actions{gap:6px}.control{min-height:38px;padding:8px 10px;font-size:11px}.archive-nav{grid-template-columns:1fr}.archive-link.empty{display:none}.article h1{font-size:34px}.body{font-size:16px;line-height:1.86}.source-strip{align-items:flex-start;flex-direction:column}.source-button{min-height:40px;display:inline-flex;align-items:center}}
@media(prefers-reduced-motion:reduce){.brandbar{animation:none!important;opacity:1!important;transform:none!important}.brandmark{animation:none!important;transform:none!important}html{scroll-behavior:auto}.to-top{transition:none!important}}

<body>
<a class="skip-link" href="#articleRoot">跳到文章</a><div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
<main>
  <div class="brandbar"><div class="brandlock"><img class="brandmark" src="./assets/velnar-symbol.svg" alt="VELNAR"><span class="brandname">VELNAR</span><span class="product">Weekly Deep Read</span></div><span class="mode">Research note</span></div>
  <div class="topbar"><a class="control" href="./deep-read.html">← 返回目录</a><div class="top-actions"><button class="control" id="readBtn" type="button">标记已读</button></div></div>
  <div class="toc-shell" id="tocShell"><nav class="toc" id="toc" aria-label="阅读笔记章节"></nav></div>
  <div id="articleRoot"><div class="error">正在加载阅读笔记…</div></div>
  <nav class="archive-nav" id="archiveNav" aria-label="前后文章"></nav>
  <div class="footerbrand"><img src="./assets/velnar-symbol.svg" alt=""><span>VELNAR · WEEKLY DEEP READ</span></div>
</main>
<button class="to-top" id="toTop" type="button" aria-label="回到顶部">↑</button>
<script>
const READ_KEY='velnar-deep-read-read-v1';let allItems=[];let currentItem=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readSet(){try{const v=JSON.parse(localStorage.getItem(READ_KEY)||'[]');return new Set(Array.isArray(v)?v:[])}catch{return new Set()}}function writeSet(set){try{localStorage.setItem(READ_KEY,JSON.stringify([...set]))}catch{}}
function safeHref(value){try{const u=new URL(String(value||''),location.href);return u.protocol==='http:'||u.protocol==='https:'?u.href:'#'}catch{return'#'}}
function inlineMarkdown(value){const tokens=[];const stash=html=>{const token='@@VELNAR_MD_'+tokens.length+'@@';tokens.push(html);return token};let s=String(value??'');s=s.replace(/`([^`\n]+)`/g,(_,code)=>stash('<code>'+esc(code)+'</code>'));s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>stash('<a href="'+esc(safeHref(url))+'" target="_blank" rel="noopener noreferrer">'+esc(label).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')+'</a>'));s=esc(s);s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');tokens.forEach((html,i)=>{s=s.replace('@@VELNAR_MD_'+i+'@@',html)});return s}
function inlineLines(lines){return lines.map((line,i)=>{const hard=/\s{2,}$/.test(line);const clean=hard?line.replace(/\s{2,}$/,''):line;return inlineMarkdown(clean)+(i<lines.length-1?(hard?'<br>':' '):'')}).join('')}
function markdownToHtml(markdown){const lines=String(markdown??'').replace(/\r\n?/g,'\n').split('\n');const out=[];let i=0,headingIndex=0,paragraph=[];const flushParagraph=()=>{if(!paragraph.length)return;out.push('<p>'+inlineLines(paragraph)+'</p>');paragraph=[]};while(i<lines.length){const line=lines[i];const fence=line.match(/^\s*```([^\s`]*)\s*$/);if(fence){flushParagraph();const code=[];i++;while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){code.push(lines[i]);i++}if(i<lines.length)i++;const lang=fence[1]?(' data-language="'+esc(fence[1])+'"'):'';out.push('<pre><code'+lang+'>'+esc(code.join('\n'))+'</code></pre>');continue}if(!line.trim()){flushParagraph();i++;continue}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){flushParagraph();headingIndex++;const level=heading[1].length;const id='md-heading-'+headingIndex;out.push('<h'+level+' id="'+id+'" data-md-heading="1">'+inlineMarkdown(heading[2])+'</h'+level+'>');i++;continue}if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){flushParagraph();out.push('<hr>');i++;continue}if(/^\s*>\s?/.test(line)){flushParagraph();const quote=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){quote.push(lines[i].replace(/^\s*>\s?/,''));i++}out.push('<blockquote><p>'+inlineLines(quote)+'</p></blockquote>');continue}if(/^\s*[-*+]\s+/.test(line)){flushParagraph();const items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*+]\s+/,''));i++}out.push('<ul>'+items.map(x=>'<li>'+inlineMarkdown(x)+'</li>').join('')+'</ul>');continue}if(/^\s*\d+[.)]\s+/.test(line)){flushParagraph();const items=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+[.)]\s+/,''));i++}out.push('<ol>'+items.map(x=>'<li>'+inlineMarkdown(x)+'</li>').join('')+'</ol>');continue}paragraph.push(line);i++}flushParagraph();return out.join('')}
function accessLabel(access){const type=access&&access.type||'unknown';return type==='free'?'Free access':type==='paywalled'?'Paywalled':type==='restricted'?'Restricted access':'Access unknown'}
function canonicalBody(item){if(item.content_status==='published_verbatim'){if(typeof item.content_markdown==='string'&&item.content_markdown.trim())return '<div class="deep-read-body">'+markdownToHtml(item.content_markdown)+'</div>';return '<div class="deep-read-status">该条目已标记为正式发布，但正文 content_markdown 缺失。</div>'}if(item.content_status==='legacy_summary_do_not_render_as_body')return '<div class="deep-read-status">该历史条目目前只有旧版索引摘要，尚未迁移 ChatGPT 完整 Deep Read；旧摘要不作为正式正文展示。</div>';return '<div class="deep-read-status">该条目暂无可发布的正式 Deep Read 正文。</div>'}
function renderArticle(item){currentItem=item;window.currentItem=item;const authors=Array.isArray(item.author)?item.author.join(' · '):String(item.author||'');const themes=(item.themes||[]).map(esc).join(' · ');const sourceTitle=[item.publication,item.institution].filter(Boolean).join(' · ');const accessNote=item.access&&item.access.note?item.access.note:accessLabel(item.access);const sourceUrl=safeHref(item.source_url||'');const sourceButton=item.source_url?'<a class="source-button" href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer">打开原文 ↗</a>':'';articleRoot.innerHTML='<article class="article"><header class="hero-block"><div class="kicker"><span class="dr-badge">DR</span><span class="meta">'+esc(item.added_date||'')+' · '+esc(item.id)+'</span></div><h1>'+esc(item.title)+'</h1><div class="byline">'+esc(authors)+(authors&&sourceTitle?' · ':'')+esc(sourceTitle)+'</div><p class="themes">'+themes+'</p><div class="reading-meta"><span>'+esc(item.estimated_reading_time||'长篇阅读')+'</span><span class="dot">·</span><span>原文 '+esc(item.original_publish_date||'日期未注明')+'</span><span class="dot">·</span><span>'+esc(item.topic||'Deep Read')+'</span></div><div class="source-strip"><div class="source-copy"><div class="source-name">'+esc(item.publication||'Original source')+'</div><div class="source-access">'+esc(accessNote)+'</div></div>'+sourceButton+'</div></header>'+canonicalBody(item)+'</article>';document.title=item.title+' · Weekly Deep Read';updateReadButton();buildToc();observeSections();updateProgress()}
function buildToc(){const headings=[...document.querySelectorAll('.deep-read-body [data-md-heading]')];toc.innerHTML=headings.map(h=>'<a class="toc-link" href="#'+h.id+'" data-target="'+h.id+'">'+esc(h.textContent)+'</a>').join('');tocShell.classList.toggle('visible',headings.length>1)}
let observer=null;function observeSections(){if(observer)observer.disconnect();const links=[...document.querySelectorAll('.toc-link')];const headings=[...document.querySelectorAll('.deep-read-body [data-md-heading]')];if(!headings.length)return;observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(!visible)return;links.forEach(a=>a.classList.toggle('active',a.dataset.target===visible.target.id))},{rootMargin:'-120px 0px -65% 0px',threshold:[0,.1,1]});headings.forEach(h=>observer.observe(h))}
function updateReadButton(){if(!currentItem)return;const set=readSet();readBtn.textContent=set.has(currentItem.id)?'标记未读':'标记已读'}readBtn.addEventListener('click',()=>{if(!currentItem)return;const set=readSet();if(set.has(currentItem.id))set.delete(currentItem.id);else set.add(currentItem.id);writeSet(set);updateReadButton()});
function renderNav(){const sorted=[...allItems].sort((a,b)=>String(b.added_date||'').localeCompare(String(a.added_date||''))||String(b.id).localeCompare(String(a.id)));const i=sorted.findIndex(x=>x.id===currentItem.id);const newer=i>0?sorted[i-1]:null;const older=i>=0&&i<sorted.length-1?sorted[i+1]:null;function card(x,label){return x?'<a class="archive-link" href="./deep-read-article.html?id='+encodeURIComponent(x.id)+'"><span class="archive-label">'+label+'</span><span><div class="archive-title">'+esc(x.title)+'</div><div class="archive-meta">'+esc(x.publication||'')+' · '+esc(x.original_publish_date||'')+'</div></span></a>':'<span class="archive-link empty"></span>'}archiveNav.innerHTML=card(newer,'Newer')+card(older,'Older')}
function updateProgress(){const doc=document.documentElement;const max=Math.max(1,doc.scrollHeight-innerHeight);progressBar.style.transform='scaleX('+Math.max(0,Math.min(1,scrollY/max))+')';toTop.classList.toggle('visible',scrollY>700)}window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
async function load(){try{const id=new URLSearchParams(location.search).get('id');const r=await fetch('./deep-read.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();allItems=Array.isArray(data.items)?data.items:[];const item=allItems.find(x=>x.id===id)||allItems[0];if(!item)throw new Error('没有可阅读内容');renderArticle(item);renderNav()}catch(err){articleRoot.innerHTML='<div class="error">阅读笔记加载失败。 '+esc(err.message)+'</div>'}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));load();
</script>
