name: VELNAR Content Validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact promoted main SHA
        required: true
        type: string
      publication_base:
        description: Validated publication parent SHA
        required: true
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: velnar-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify dispatched publication identity
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PUBLICATION_BASE: ${{ inputs.publication_base }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" = refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLICATION_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" = "$PUBLICATION_BASE" ]]

      - name: Check publishing script syntax
        shell: bash
        run: |
          for file in scripts/*.js; do
            node --check "$file"
          done

      - name: Validate canonical research content
        run: node scripts/validate-publish.js

      - name: Test publication promoter safety
        run: |
          node scripts/test-publication-promoter.js
          node scripts/test-validation-proof.js

      - name: Validate publication change scope
        env:
          CHANGE_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_base || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
        run: node scripts/validate-change-scope.js --base "$CHANGE_BASE"

      - name: Resolve trusted history baseline
        id: history-base
        shell: bash
        env:
          FALLBACK_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_base || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$FALLBACK_BASE"
          else
            BASE_SHA="$(node scripts/resolve-history-base.js --fallback "$FALLBACK_BASE")"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "History baseline: $BASE_SHA"

      - name: Validate publication history
        run: node scripts/validate-history.js --base "${{ steps.history-base.outputs.sha }}"

      - name: Validate website runtime
        run: node scripts/validate-runtime.js

      - name: Generate release health preview
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/generate-release-status.js --output release-status.preview.json --commit "$RELEASE_SHA"
          cat release-status.preview.json

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-status
          path: release-status.preview.json
          retention-days: 7

  publication-deploy-handoff:
    name: Hand validated publication to safe deploy
    needs: validate-content
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch exact validated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run safe-pages-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f expected_sha="$GITHUB_SHA" -f validated_run="$GITHUB_RUN_ID"
