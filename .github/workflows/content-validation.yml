name: VELNAR Content Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: velnar-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check publishing script syntax
        shell: bash
        run: |
          for file in scripts/*.js; do
            node --check "$file"
          done

      - name: Validate canonical research content
        run: node scripts/validate-publish.js

      - name: Resolve candidate change base
        id: change-base
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate change base: $BASE_SHA"

      - name: Validate publication change scope
        env:
          CHANGE_BASE: ${{ steps.change-base.outputs.sha }}
        run: node scripts/validate-change-scope.js --base "$CHANGE_BASE"

      - name: Resolve trusted history baseline
        id: history-base
        shell: bash
        env:
          FALLBACK_BASE: ${{ steps.change-base.outputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$FALLBACK_BASE"
          else
            BASE_SHA="$(node scripts/resolve-history-base.js --fallback "$FALLBACK_BASE")"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "History baseline: $BASE_SHA"

      - name: Validate publication history
        run: node scripts/validate-history.js --base "${{ steps.history-base.outputs.sha }}"

      - name: Validate website runtime
        run: node scripts/validate-runtime.js

      - name: Generate release health preview
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/generate-release-status.js --output release-status.preview.json --commit "$RELEASE_SHA"
          cat release-status.preview.json

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-status
          path: release-status.preview.json
          retention-days: 7
