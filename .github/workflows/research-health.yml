name: VELNAR Research Health Audit

on:
  workflow_run:
    workflows:
      - VELNAR Safe Pages Deploy
    types:
      - completed
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed publication SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: velnar-research-health
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository and live production
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify dispatched release identity
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" = refs/heads/main ]]
          [[ "$GITHUB_SHA" = "$EXPECTED_SHA" ]]

      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check publishing script syntax
        shell: bash
        run: |
          for file in scripts/*.js; do
            node --check "$file"
          done

      - name: Validate canonical research content
        run: node scripts/validate-publish.js

      - name: Validate website runtime
        run: node scripts/validate-runtime.js

      - name: Generate health audit
        run: node scripts/health-audit.js --output health-audit.json

      - name: Check live production
        env:
          DEPLOYED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '') }}
        shell: bash
        run: |
          if [ -n "$DEPLOYED_SHA" ]; then
            node scripts/check-live-release.js --commit "$DEPLOYED_SHA"
          else
            node scripts/check-live-release.js
          fi

      - name: Upload health artifact
        uses: actions/upload-artifact@v4
        with:
          name: velnar-research-health
          path: health-audit.json
          retention-days: 14
