name: VELNAR Publication Branch Promoter

on:
  workflow_run:
    workflows:
      - VELNAR Publication Candidate Signal
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: Existing publication candidate branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: velnar-publication-promoter
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'create' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (startsWith(github.event.workflow_run.head_branch, 'radar/publish-') ||
        startsWith(github.event.workflow_run.head_branch, 'consumer/publish-') ||
        startsWith(github.event.workflow_run.head_branch, 'deep-read/publish-'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and atomically promote publication
        env:
          PUBLICATION_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.branch }}
          EXPECTED_CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-publication.js
