name: VELNAR Industry Radar Autonomous Publisher

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Research and deduplicate without publishing canonical files'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/industry-radar-publisher.yml'
      - 'scripts/run-industry-radar.js'
      - 'docs/industry-radar-autonomous-publisher.md'

permissions:
  contents: write

concurrency:
  group: velnar-industry-radar-publisher
  cancel-in-progress: false

jobs:
  research-and-publish:
    name: Research and publish atomically
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RADAR_MODEL: ${{ vars.OPENAI_RADAR_MODEL || 'gpt-6-sol' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record publication base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Repository contract self-test
        if: github.event_name == 'push'
        run: node scripts/run-industry-radar.js --self-test

      - name: Dry-run research smoke test after publisher changes
        if: github.event_name == 'push' && env.OPENAI_API_KEY != ''
        run: node scripts/run-industry-radar.js --dry-run

      - name: Note missing research credential on infrastructure push
        if: github.event_name == 'push' && env.OPENAI_API_KEY == ''
        run: echo '::notice::OPENAI_API_KEY is not configured yet; contract self-test passed, but autonomous research was not executed.'

      - name: Require research credential for scheduled/manual production run
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::OPENAI_API_KEY is required for autonomous Industry Radar research.'
            exit 1
          fi

      - name: Run autonomous Industry Radar research
        id: radar
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/run-industry-radar.js --dry-run
          else
            node scripts/run-industry-radar.js
          fi

      - name: Stop after dry run or empty scan
        if: github.event_name != 'push' && steps.radar.outputs.changed != 'true'
        run: echo 'No canonical Industry publication prepared; nothing to commit.'

      - name: Validate prepared canonical content
        if: github.event_name != 'push' && steps.radar.outputs.changed == 'true'
        run: |
          node scripts/validate-publish.js
          node scripts/validate-runtime.js

      - name: Create one local atomic publication commit
        if: github.event_name != 'push' && steps.radar.outputs.changed == 'true'
        id: candidate
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git config user.name 'VELNAR Research Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news-index.json news-index-segments news-items
          git diff --cached --quiet && { echo '::error::Publisher reported changes but staged diff is empty.'; exit 1; }
          git commit -m "Publish Industry Radar autonomous scan"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          node scripts/validate-change-scope.js --base "$BASE_SHA"
          node scripts/validate-history.js --base "$BASE_SHA"

      - name: Fast-forward main only if the recorded base is still current
        if: github.event_name != 'push' && steps.radar.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [ "$CURRENT_MAIN" != "$BASE_SHA" ]; then
            echo "::notice::Main moved from $BASE_SHA to $CURRENT_MAIN while research was running. Candidate was not pushed; the next scheduled run will rebuild against latest main."
            exit 0
          fi
          git push origin HEAD:main
          echo "Published atomic Industry candidate $(git rev-parse HEAD). Existing validation/deploy workflows now own production release."
