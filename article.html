<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VELNAR Intelligence Radar — long-form AI industry analysis">
<title>VELNAR Intelligence Radar</title>
<link rel="icon" href="./assets/velnar-symbol.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f4f7;--card:#fff;--text:#111214;--muted:#777983;--line:#e3e5ea;--line-strong:#d7d9e1;--soft:#f7f7f9;--brand:#080c43;--reading:660px;
  --ease-velnar:cubic-bezier(.23,1,.32,1);--dur-press:120ms;--dur-hover:160ms;--dur-state:220ms;--dur-brand:560ms;
}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}
.skip-link{position:fixed;left:14px;top:10px;z-index:1100;transform:translateY(-140%);background:#111;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;text-decoration:none;transition:transform var(--dur-state) var(--ease-velnar)}.skip-link:focus{transform:translateY(0)}
.progress-track{position:fixed;top:0;left:0;right:0;height:2px;z-index:1000;background:transparent;pointer-events:none}.progress-bar{width:100%;height:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#1daace 0%,#396ee3 48%,#6b42ea 100%);will-change:transform}
main{max-width:860px;margin:0 auto;padding:22px 16px 80px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;opacity:0;transform:translateY(4px);animation:brandIn var(--dur-brand) var(--ease-velnar) 60ms forwards}.brandlock{display:flex;align-items:center;gap:9px}.brandmark{width:28px;height:28px;display:block;transform:scale(.96);animation:markIn var(--dur-brand) var(--ease-velnar) 60ms forwards}.brandname{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand)}.product{font-size:11px;color:var(--muted);margin-left:2px}.mode{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8b8d95}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,.state{border:1px solid var(--line);background:rgba(255,255,255,.9);color:#26272d;border-radius:999px;padding:9px 13px;font:inherit;font-size:12px;text-decoration:none;cursor:pointer;transition:background var(--dur-hover) ease,transform var(--dur-hover) var(--ease-velnar);outline:none}.back:active,.state:active{transform:scale(.985)}.back:focus-visible,.state:focus-visible,.sources a:focus-visible{box-shadow:0 0 0 3px rgba(57,110,227,.18),0 0 0 1px rgba(57,110,227,.55);outline:none}
.article{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:34px 34px 44px;box-shadow:0 1px 0 rgba(17,18,20,.02)}.article>*{max-width:var(--reading);margin-left:auto;margin-right:auto}.hero-block{padding-bottom:26px;border-bottom:1px solid var(--line)}.kicker{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#111;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}.grade.A{background:#4b4e58}.grade.B{background:#8d9099}.meta{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}.article h1{font-size:clamp(34px,5vw,48px);line-height:1.08;letter-spacing:-1.45px;margin:0 0 12px;text-wrap:balance}.themes{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 4px;letter-spacing:.01em}.deck{font-size:17px;line-height:1.72;color:#383a42;margin:20px 0 0;text-wrap:pretty}
.section{padding-top:34px}.section h2{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#646670;margin:0 0 14px;font-weight:800}.section h2::before{content:"";display:block;width:18px;height:1px;background:#b9bbc3}.body{font-size:16px;line-height:1.92;color:#25262c;white-space:pre-line;text-wrap:pretty}.body strong{font-weight:680}.section[data-tone="fact"] h2{color:#34445f}.section[data-tone="inference"] h2{color:#4e4d62}.section[data-tone="risk"] h2{color:#65514a}.section[data-tone="prediction"] h2{color:#4c5264}.question{background:#f5f6f8;border:1px solid #eceef2;border-radius:14px;padding:18px 18px;line-height:1.8}.sources{display:grid;gap:10px}.sources a{display:block;padding:10px 0;border-bottom:1px solid #eceef2;color:#24262c;text-decoration:none;font-size:14px;line-height:1.55;transition:color var(--dur-hover) ease,transform var(--dur-hover) var(--ease-velnar)}.sources a:last-child{border-bottom:0}.source-index{display:inline-block;min-width:28px;color:#9698a0;font-size:10px;font-variant-numeric:tabular-nums}.legacy{font-size:13px;line-height:1.65;color:var(--muted);background:#f8f8f9;padding:13px 14px;border-radius:12px;margin-top:22px}.error{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;color:#666}
.footerbrand{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:28px;color:#8a8c94;font-size:10px;letter-spacing:.08em}.footerbrand img{width:18px;height:18px;opacity:.9}
@keyframes brandIn{to{opacity:1;transform:translateY(0)}}@keyframes markIn{to{transform:scale(1)}}
@media(hover:hover) and (pointer:fine){.back:hover,.state:hover{background:#fff;transform:translateY(-1px)}.sources a:hover{color:#111;transform:translateX(2px)}}
@media(max-width:640px){main{padding:14px 10px 52px}.brandbar{margin:2px 4px 18px}.mode,.product{display:none}.article{padding:24px 18px 32px;border-radius:19px}.article h1{font-size:31px;line-height:1.14;letter-spacing:-.8px}.body{font-size:15.5px;line-height:1.88}.deck{font-size:15.5px;line-height:1.72}.topbar{margin-bottom:14px}.section{padding-top:29px}.hero-block{padding-bottom:22px}}
@media(prefers-reduced-motion:reduce){.brandbar,.brandmark,.back,.state,.sources a,.skip-link{animation:none!important;transition:none!important;transform:none!important}.brandbar{opacity:1}.progress-bar{will-change:auto}}
</style>
</head>
<body>
<a class="skip-link" href="#articleRoot">跳到文章</a>
<div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
<main>
  <div class="brandbar"><div class="brandlock"><img class="brandmark" src="./assets/velnar-symbol.svg" alt="VELNAR"><span class="brandname">VELNAR</span><span class="product">Intelligence Radar</span></div><span class="mode">Research note</span></div>
  <div class="topbar"><a class="back" href="./index.html">← 返回目录</a><button class="state" id="stateBtn" type="button" aria-pressed="false">标记未读</button></div>
  <div id="articleRoot"></div>
  <div class="footerbrand"><img src="./assets/velnar-symbol.svg" alt=""><span>VELNAR · INTELLIGENCE RADAR</span></div>
</main>
<script>
const READ_KEY='ai-industry-radar-read-v1';const id=new URLSearchParams(location.search).get('id');let readSet=new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]'));
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveRead(){localStorage.setItem(READ_KEY,JSON.stringify([...readSet]))}
function sec(title,text,cls='',tone=''){if(!text)return '';return '<section class="section"'+(tone?' data-tone="'+tone+'"':'')+'><h2>'+esc(title)+'</h2><div class="body '+cls+'">'+esc(text)+'</div></section>'}
function sourceHtml(s,i){const label=typeof s==='string'?s:(s&&s.label)||((s&&s.url)||'');const url=typeof s==='string'?s:(s&&s.url)||'';if(!url)return '';return '<a href="'+esc(url)+'" target="_blank" rel="noopener"><span class="source-index">'+String(i+1).padStart(2,'0')+'</span>'+esc(label)+'</a>'}
function render(e){document.title=e.title+' · VELNAR Intelligence Radar';const themes=(e.themes||[]).join(' · ');const sources=(e.sources||[]).map(sourceHtml).filter(Boolean).join('');const hasDeep=e.map_change||e.challenges_existing_assumptions||e.startup_implications||e.prediction;articleRoot.innerHTML='<article class="article"><div class="hero-block"><div class="kicker"><span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span><span class="meta">'+esc(e.date)+' · '+esc(e.id)+'</span></div><h1>'+esc(e.title)+'</h1>'+(themes?'<div class="themes">'+esc(themes)+'</div>':'')+(e.deck?'<div class="deck">'+esc(e.deck)+'</div>':'')+'</div>'+sec('Fact｜发生了什么',e.fact,'','fact')+sec('Why it matters｜为什么重要',e.why_it_matters,'','inference')+sec('What is actually new｜真正新增',e.what_is_new,'','inference')+sec('Map change｜产业地图变化',e.map_change,'','inference')+sec('Challenges existing assumptions｜对既有判断的挑战',e.challenges_existing_assumptions,'','inference')+sec('Hype / uncertainty｜反证与不确定性',e.hype_uncertainty,'','risk')+sec('Startup implications｜创业含义',e.startup_implications,'','inference')+sec('Prediction｜预测',e.prediction,'','prediction')+sec('Discussion question｜讨论问题',e.discussion_question,'question','prediction')+(sources?'<section class="section"><h2>Sources｜来源</h2><div class="sources">'+sources+'</div></section>':'')+(!hasDeep&&!e.what_is_new&&!e.hype_uncertainty&&!e.discussion_question?'<div class="legacy">历史迁移条目目前只保存了摘要。后续新文章会使用完整深度结构。</div>':'')+'</article>';updateProgress()}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight;const ratio=max>0?Math.min(1,Math.max(0,window.scrollY/max)):0;progressBar.style.transform='scaleX('+ratio+')'}
stateBtn.addEventListener('click',()=>{if(!id)return;readSet.delete(id);saveRead();stateBtn.textContent='已标记未读';stateBtn.setAttribute('aria-pressed','true')});window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);
async function load(){if(!id){articleRoot.innerHTML='<div class="error">缺少文章 ID。</div>';return}readSet.add(id);saveRead();try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const e=(data.items||[]).find(x=>x.id===id);if(!e)throw new Error('未找到该文章');render(e)}catch(err){articleRoot.innerHTML='<div class="error">文章加载失败：'+esc(err.message)+'</div>'}}load();
</script>
</body>
</html>
