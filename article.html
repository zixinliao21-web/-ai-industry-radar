function estimateMinutes(e){const text=(typeof e.article_text==='string'&&e.article_text.trim())?e.article_text:['deck',...SECTION_DEFS.map(x=>x[0])].map(k=>e[k]||'').join('');const cjk=(text.match(/[\u3400-\u9fff]/g)||[]).length,latin=(text.match(/[A-Za-z0-9]+/g)||[]).length;return Math.max(1,Math.round(cjk/450+latin/220))}function showToast(text){toast.textContent=text;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),1500)}function articleUrl(e=currentItem){return location.origin+location.pathname+'?id='+encodeURIComponent(e?e.id:id||'')}function displayUrl(url){try{const u=new URL(url);return u.host+u.pathname+u.search}catch{return url}}
function render(e){currentItem=e;const themes=(e.themes||[]).join(' · '),sources=(e.sources||[]).map(sourceHtml).filter(Boolean).join(''),sourceCount=(e.sources||[]).length,minutes=estimateMinutes(e),hasCanonical=typeof e.article_text==='string'&&!!e.article_text.trim(),sectionCount=(hasCanonical?1:SECTION_DEFS.filter(([k])=>e[k]).length)+(sourceCount?1:0);document.title=e.title+' · VELNAR Intelligence Radar';const canonical=articleUrl(e);canonicalLink.href=canonical;document.querySelector('meta[property="og:title"]').content=e.title+' · VELNAR Intelligence Radar';document.querySelector('meta[property="og:description"]').content=e.deck||'Long-form AI industry analysis';const canonicalBody=hasCanonical?'<section class="section canonical-article" id="sec-article" data-key="article"><div class="body article-text">'+esc(e.article_text)+'</div></section>':SECTION_DEFS.map(([k,,label,tone])=>sec(k,label,e[k],k==='discussion_question'?'question':'',tone)).join('');articleRoot.innerHTML='<article class="article"><div class="hero-block"><div class="kicker"><span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span><span class="meta">'+esc(e.date)+' · '+esc(e.id)+'</span></div><h1>'+esc(e.title)+'</h1>'+(themes?'<div class="themes">'+esc(themes)+'</div>':'')+(e.deck?'<div class="deck">'+esc(e.deck)+'</div>':'')+'<div class="reading-meta"><span>约 '+minutes+' 分钟阅读</span><span class="dot">·</span><span>'+sectionCount+' 个章节</span>'+(sourceCount?'<span class="dot">·</span><span>'+sourceCount+' 个来源</span>':'')+'</div></div>'+canonicalBody+(sources?'<section class="section" id="sec-sources" data-key="sources"><h2>Sources｜来源</h2><div class="sources">'+sources+'</div></section>':'')+'</article>';buildToc(e,sourceCount,hasCanonical);buildArchiveNav(e);updateProgress();restoreHash();syncReadButton()}
function buildToc(e,sourceCount,hasCanonical=false){const defs=hasCanonical?[['article','Article']]:SECTION_DEFS.filter(([k])=>e[k]).map(([k,short])=>[k,short]);if(sourceCount)defs.push(['sources','Sources']);if(defs.length<2){tocShell.classList.remove('visible');return}toc.innerHTML=defs.map(([k,short])=>'<a class="toc-link" href="#sec-'+k+'" data-key="'+k+'">'+short+'</a>').join('');tocShell.classList.add('visible');observeSections()}
function observeSections(){if(observer)observer.disconnect();const sections=[...document.querySelectorAll('.section[data-key]')];observer=new IntersectionObserver(entries=>{const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(!visible)return;const key=visible.target.dataset.key;document.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('active',a.dataset.key===key));document.querySelector('.toc-link.active')?.scrollIntoView({block:'nearest',inline:'center'})},{rootMargin:'-15% 0px -70% 0px',threshold:0});sections.forEach(s=>observer.observe(s))}
function buildArchiveNav(e){const sorted=[...allItems].sort((a,b)=>b.date.localeCompare(a.date)||({S:0,A:1,B:2}[a.grade]-{S:0,A:1,B:2}[b.grade]));const i=sorted.findIndex(x=>x.id===e.id),newer=i>0?sorted[i-1]:null,older=i>=0&&i<sorted.length-1?sorted[i+1]:null;const card=(x,label)=>x?'<a class="archive-link" href="./article.html?id='+encodeURIComponent(x.id)+'"><span class="archive-label">'+label+'</span><span class="archive-title">'+esc(x.title)+'</span><span class="archive-meta">'+esc(x.date)+' · '+esc(x.grade)+'</span></a>':'<span class="archive-link empty"></span>';archiveNav.innerHTML=card(newer,'较新一篇')+card(older,'较早一篇')}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight,ratio=max>0?Math.min(1,Math.max(0,scrollY/max)):0;progressBar.style.transform='scaleX('+ratio+')';toTop.classList.toggle('visible',scrollY>700);progressTick=false}function requestProgress(){if(!progressTick){progressTick=true;requestAnimationFrame(updateProgress)}}function restoreHash(){if(location.hash){const el=document.querySelector(location.hash);if(el)setTimeout(()=>el.scrollIntoView(),60)}}
function renderQr(target,url,size=256){target.innerHTML='';if(!window.QRCode)return false;new QRCode(target,{text:url,width:size,height:size,colorDark:'#111214',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});target.querySelectorAll('img').forEach(img=>img.remove());return true}
function openShare(){if(!currentItem)return;lastFocus=document.activeElement;const themes=(currentItem.themes||[]).slice(0,3).join(' · '),url=articleUrl(currentItem);shareGrade.textContent=currentItem.grade||'—';shareGrade.className='share-grade '+(currentItem.grade||'');shareDate.textContent=currentItem.date||'';shareThemes.textContent=themes;shareTitle.textContent=currentItem.title||'';shareDeck.textContent=currentItem.deck||'AI Industry Signals & Strategic Analysis';shareUrl.textContent=displayUrl(url);renderQr(shareQr,url,256);shareLayer.classList.add('visible');shareLayer.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');setTimeout(()=>shareClose.focus(),30)}function closeShare(){shareLayer.classList.remove('visible');shareLayer.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');lastFocus?.focus?.()}
function fileToDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function inlineImages(source,clone){const srcImgs=[...source.querySelectorAll('img')],dstImgs=[...clone.querySelectorAll('img')];await Promise.all(srcImgs.map(async(img,i)=>{const dst=dstImgs[i];if(!dst)return;try{const res=await fetch(img.currentSrc||img.src);if(res.ok)dst.src=await fileToDataUrl(await res.blob())}catch{}}))}
function copyComputedStyles(source,clone){const src=[source,...source.querySelectorAll('*')],dst=[clone,...clone.querySelectorAll('*')];src.forEach((el,i)=>{const out=dst[i];if(!out)return;const cs=getComputedStyle(el);let css='';for(const prop of cs)css+=prop+':'+cs.getPropertyValue(prop)+';';out.setAttribute('style',css)});const canvases=[...source.querySelectorAll('canvas')],cloneCanvases=[...clone.querySelectorAll('canvas')];canvases.forEach((canvas,i)=>{const c=cloneCanvases[i];if(!c)return;const img=document.createElement('img');img.src=canvas.toDataURL('image/png');img.setAttribute('style',c.getAttribute('style')||'');img.width=canvas.width;img.height=canvas.height;c.replaceWith(img)})}
async function makeShareBlob(){if(!currentItem)throw new Error('missing article');await document.fonts?.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const node=shareCard,rect=node.getBoundingClientRect();if(!rect.width||!rect.height)throw new Error('share card not visible');const clone=node.cloneNode(true);copyComputedStyles(node,clone);await inlineImages(node,clone);clone.removeAttribute('id');clone.setAttribute('xmlns','http://www.w3.org/1999/xhtml');const serialized=new XMLSerializer().serializeToString(clone);const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+rect.width+'" height="'+rect.height+'" viewBox="0 0 '+rect.width+' '+rect.height+'"><foreignObject width="100%" height="100%">'+serialized+'</foreignObject></svg>';const svgUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));try{const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=svgUrl});const scale=3;const canvas=document.createElement('canvas');canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(rect.height*scale);const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('image export failed')),'image/png',1))}finally{URL.revokeObjectURL(svgUrl)}}
function downloadBlob(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VELNAR-Radar-'+(currentItem?.id||'share')+'.png';document.body.appendChild(a);a.click();const href=a.href;a.remove();setTimeout(()=>URL.revokeObjectURL(href),1200)}async function shareImage(){try{const blob=await makeShareBlob(),file=new File([blob],'VELNAR-Radar-'+(currentItem.id||'article')+'.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:currentItem.title,text:'VELNAR Intelligence Radar'});return}catch(err){if(err?.name==='AbortError')return}}downloadBlob(blob);showToast('当前浏览器不支持图片直分享，已保存 PNG')}catch{showToast('卡片生成失败，请复制链接分享')}}async function saveImage(){try{downloadBlob(await makeShareBlob());showToast('高清 Share Card 已保存')}catch{showToast('卡片生成失败')}}async function copyLink(){try{await navigator.clipboard.writeText(articleUrl(currentItem));showToast('文章链接已复制')}catch{showToast('请复制浏览器地址')}}
stateBtn.addEventListener('click',()=>{if(!id)return;if(readSet.has(id)){readSet.delete(id);showToast('已标记未读')}else{readSet.add(id);try{sessionStorage.setItem(LAST_OPENED_KEY,id)}catch{}showToast('已标记已读')}saveRead();syncReadButton();window.__velnarSync?.setRead('industry',id,readSet.has(id))});shareBtn.addEventListener('click',openShare);shareClose.addEventListener('click',closeShare);shareLayer.addEventListener('click',e=>{if(e.target===shareLayer)closeShare()});shareImageBtn.addEventListener('click',shareImage);saveImageBtn.addEventListener('click',saveImage);copyLinkBtn.addEventListener('click',copyLink);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&shareLayer.classList.contains('visible'))closeShare()});toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',requestProgress,{passive:true});addEventListener('resize',requestProgress);
async function loadIndustryIndex(){
  const stamp=Date.now();
  const r=await fetch('./news-index.json?ts='+stamp,{cache:'no-store'});
  if(!r.ok)throw new Error('Index HTTP '+r.status);
  const data=await r.json();
  if(Array.isArray(data.items))return data;
  if(data.storage!=='segmented_index'||!Array.isArray(data.segments))throw new Error('Unsupported Industry index schema');
  const paths=data.segments.map(x=>x&&x.path).filter(x=>typeof x==='string'&&/^news-index-segments\/segment-\d+\.json$/.test(x));
  if(paths.length!==data.segments.length)throw new Error('Industry index manifest invalid');
  const shards=await Promise.all(paths.map(async path=>{
    const res=await fetch('./'+path+'?ts='+stamp,{cache:'no-store'});
    if(!res.ok)throw new Error('Index segment HTTP '+res.status);
    const shard=await res.json();
    return Array.isArray(shard.items)?shard.items:[];
  }));
  const items=shards.flat();
  if(Number.isFinite(Number(data.item_count))&&items.length!==Number(data.item_count))throw new Error('Industry index count mismatch');
  return{updated_at:data.updated_at||'',items};
}
async function load(){if(!id){articleRoot.innerHTML='<div class="error">缺少文章 ID。</div>';return}syncReadButton();try{const data=await loadIndustryIndex();allItems=data.items||[];const meta=allItems.find(x=>x.id===id);if(!meta)throw new Error('未找到该文章');const itemRes=await fetch('./news-items/'+encodeURIComponent(id)+'.json?ts='+Date.now(),{cache:'no-store'});if(!itemRes.ok)throw new Error('Article HTTP '+itemRes.status);const e=await itemRes.json();if(!e||e.id!==id)throw new Error('文章数据校验失败');render(e)}catch(err){articleRoot.innerHTML='<div class="error">文章加载失败：'+esc(err.message)+'</div>'}}
window.addEventListener('velnar:sync-applied',()=>{readSet=parseStoredSet(READ_KEY);syncReadButton()});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));load();
