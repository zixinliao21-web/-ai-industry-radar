function displayUrl(url){try{const u=new URL(url);return u.host+u.pathname+u.search}catch{return url}}
function render(e){currentItem=e;const themes=(e.themes||[]).join(' · '),sources=(e.sources||[]).map(sourceHtml).filter(Boolean).join(''),sourceCount=(e.sources||[]).length,minutes=estimateMinutes(e);const sectionCount=SECTION_DEFS.filter(([k])=>e[k]).length+(sourceCount?1:0);document.title=e.title+' · VELNAR Intelligence Radar';const canonical=articleUrl(e);canonicalLink.href=canonical;document.querySelector('meta[property="og:title"]').content=e.title+' · VELNAR Intelligence Radar';document.querySelector('meta[property="og:description"]').content=e.deck||'Long-form AI industry analysis';articleRoot.innerHTML='<article class="article"><div class="hero-block"><div class="kicker"><span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span><span class="meta">'+esc(e.date)+' · '+esc(e.id)+'</span></div><h1>'+esc(e.title)+'</h1>'+(themes?'<div class="themes">'+esc(themes)+'</div>':'')+(e.deck?'<div class="deck">'+esc(e.deck)+'</div>':'')+'<div class="reading-meta"><span>约 '+minutes+' 分钟阅读</span><span class="dot">·</span><span>'+sectionCount+' 个章节</span>'+(sourceCount?'<span class="dot">·</span><span>'+sourceCount+' 个来源</span>':'')+'</div></div>'+SECTION_DEFS.map(([k,,label,tone])=>sec(k,label,e[k],k==='discussion_question'?'question':'',tone)).join('')+(sources?'<section class="section" id="sec-sources" data-key="sources"><h2>Sources｜来源</h2><div class="sources">'+sources+'</div></section>':'')+'</article>';buildToc(e,sourceCount);buildArchiveNav(e);updateProgress();restoreHash()}
function buildToc(e,sourceCount){const defs=SECTION_DEFS.filter(([k])=>e[k]).map(([k,short])=>[k,short]);if(sourceCount)defs.push(['sources','Sources']);if(defs.length<2){tocShell.classList.remove('visible');return}toc.innerHTML=defs.map(([k,short])=>'<a class="toc-link" href="#sec-'+k+'" data-key="'+k+'">'+short+'</a>').join('');tocShell.classList.add('visible');observeSections()}
function observeSections(){if(observer)observer.disconnect();const sections=[...document.querySelectorAll('.section[data-key]')];observer=new IntersectionObserver(entries=>{const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(!visible)return;const key=visible.target.dataset.key;document.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('active',a.dataset.key===key));const active=document.querySelector('.toc-link.active');if(active)active.scrollIntoView({block:'nearest',inline:'center'})},{rootMargin:'-15% 0px -70% 0px',threshold:0});sections.forEach(s=>observer.observe(s))}
function buildArchiveNav(e){const sorted=[...allItems].sort((a,b)=>b.date.localeCompare(a.date)||({S:0,A:1,B:2}[a.grade]-{S:0,A:1,B:2}[b.grade]));const i=sorted.findIndex(x=>x.id===e.id),newer=i>0?sorted[i-1]:null,older=i>=0&&i<sorted.length-1?sorted[i+1]:null;const card=(x,label)=>x?'<a class="archive-link" href="./article.html?id='+encodeURIComponent(x.id)+'"><span class="archive-label">'+label+'</span><span class="archive-title">'+esc(x.title)+'</span><span class="archive-meta">'+esc(x.date)+' · '+esc(x.grade)+'</span></a>':'<span class="archive-link empty"></span>';archiveNav.innerHTML=card(newer,'较新一篇')+card(older,'较早一篇')}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight,ratio=max>0?Math.min(1,Math.max(0,scrollY/max)):0;progressBar.style.transform='scaleX('+ratio+')';toTop.classList.toggle('visible',scrollY>700);progressTick=false}function requestProgress(){if(!progressTick){progressTick=true;requestAnimationFrame(updateProgress)}}function restoreHash(){if(location.hash){const el=document.querySelector(location.hash);if(el)setTimeout(()=>el.scrollIntoView(),60)}}
function openShare(){if(!currentItem)return;lastFocus=document.activeElement;const themes=(currentItem.themes||[]).slice(0,3).join(' · '),url=articleUrl(currentItem);shareGrade.textContent=currentItem.grade||'—';shareGrade.className='share-grade '+esc(currentItem.grade||'');shareDate.textContent=currentItem.date||'';shareThemes.textContent=themes;shareTitle.textContent=currentItem.title||'';shareDeck.textContent=currentItem.deck||'AI Industry Signals & Strategic Analysis';shareUrl.textContent=displayUrl(url);shareLayer.classList.add('visible');shareLayer.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');setTimeout(()=>shareClose.focus(),30)}
function closeShare(){shareLayer.classList.remove('visible');shareLayer.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function roundedRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function wrapLines(ctx,text,maxWidth,maxLines){const chars=Array.from(String(text||''));const lines=[];let line='';for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length===maxLines)break}else line=test}if(lines.length<maxLines&&line)lines.push(line);if(lines.length===maxLines&&chars.join('').length>lines.join('').length){let last=lines[maxLines-1];while(last&&ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[maxLines-1]=last+'…'}return lines}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
async function makeShareBlob(){if(!currentItem)throw new Error('missing article');const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=630;const ctx=canvas.getContext('2d');ctx.fillStyle='#f5f6f8';ctx.fillRect(0,0,1200,630);ctx.fillStyle='#fff';roundedRect(ctx,24,24,1152,582,26);ctx.fill();ctx.strokeStyle='#e2e4ea';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#080c43';ctx.fillRect(24,24,1152,5);let logo=null;try{logo=await loadImage('./assets/velnar-symbol.svg')}catch{}if(logo)ctx.drawImage(logo,70,66,46,46);ctx.fillStyle='#080c43';ctx.font='800 18px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.fillText('VELNAR',132,88);ctx.fillStyle='#8b8d95';ctx.font='500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.fillText('Intelligence Radar',132,108);const gradeColor=currentItem.grade==='A'?'#4b4e58':currentItem.grade==='B'?'#8d9099':'#111214';ctx.fillStyle=gradeColor;roundedRect(ctx,70,150,46,46,11);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 18px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.textAlign='center';ctx.fillText(currentItem.grade||'—',93,181);ctx.textAlign='left';ctx.fillStyle='#777983';ctx.font='500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.fillText((currentItem.date||'')+'  ·  '+(currentItem.id||''),132,180);ctx.fillStyle='#111214';ctx.font='720 52px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';let y=250;const titleLines=wrapLines(ctx,currentItem.title,1000,3);for(const line of titleLines){ctx.fillText(line,70,y);y+=60}const themes=(currentItem.themes||[]).slice(0,3).join(' · ');if(themes){ctx.fillStyle='#777983';ctx.font='500 16px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.fillText(themes,70,y+4);y+=38}ctx.fillStyle='#555861';ctx.font='400 23px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';const deckLines=wrapLines(ctx,currentItem.deck||'AI Industry Signals & Strategic Analysis',920,2);for(const line of deckLines){ctx.fillText(line,70,y);y+=34}ctx.strokeStyle='#e8e9ed';ctx.beginPath();ctx.moveTo(70,523);ctx.lineTo(1130,523);ctx.stroke();ctx.fillStyle='#858790';ctx.font='500 15px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';const urlText=displayUrl(articleUrl(currentItem));const urlLines=wrapLines(ctx,urlText,740,2);let uy=556;for(const line of urlLines){ctx.fillText(line,70,uy);uy+=20}ctx.fillStyle='#777983';ctx.textAlign='right';ctx.font='700 13px -apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif';ctx.fillText('VELNAR · INTELLIGENCE RADAR',1130,566);ctx.textAlign='left';return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('image export failed')),'image/png',1))}
function downloadBlob(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VELNAR-Radar-'+(currentItem&&currentItem.id?currentItem.id:'share')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
async function shareImage(){try{const blob=await makeShareBlob();const file=new File([blob],'VELNAR-Radar-'+(currentItem.id||'article')+'.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:currentItem.title,text:'VELNAR Intelligence Radar'});return}catch(err){if(err&&err.name==='AbortError')return}}downloadBlob(blob);showToast('当前浏览器不支持图片直分享，已保存 PNG')}catch{showToast('卡片生成失败，请复制链接分享')}}
async function saveImage(){try{downloadBlob(await makeShareBlob());showToast('Share Card 已保存')}catch{showToast('卡片生成失败')}}
async function copyLink(){try{await navigator.clipboard.writeText(articleUrl(currentItem));showToast('文章链接已复制')}catch{showToast('请复制浏览器地址')}}
stateBtn.addEventListener('click',()=>{if(!id)return;if(readSet.has(id)){readSet.delete(id);stateBtn.textContent='已标记未读';showToast('已标记未读')}else{readSet.add(id);stateBtn.textContent='标记未读';showToast('已恢复已读')}saveRead()});shareBtn.addEventListener('click',openShare);shareClose.addEventListener('click',closeShare);shareLayer.addEventListener('click',e=>{if(e.target===shareLayer)closeShare()});shareImageBtn.addEventListener('click',shareImage);saveImageBtn.addEventListener('click',saveImage);copyLinkBtn.addEventListener('click',copyLink);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&shareLayer.classList.contains('visible'))closeShare()});toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',requestProgress,{passive:true});addEventListener('resize',requestProgress);
async function load(){if(!id){articleRoot.innerHTML='<div class="error">缺少文章 ID。</div>';return}readSet.add(id);saveRead();try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();allItems=data.items||[];const e=allItems.find(x=>x.id===id);if(!e)throw new Error('未找到该文章');render(e)}catch(err){articleRoot.innerHTML='<div class="error">文章加载失败：'+esc(err.message)+'</div>'}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));load();
</script>
