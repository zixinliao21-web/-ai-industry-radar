<script>
const READ_KEY='ai-industry-radar-read-v1';const id=new URLSearchParams(location.search).get('id');let readSet=parseStoredSet(READ_KEY),progressTick=false,observer=null,currentItem=null,allItems=[],toastTimer=null;
function parseStoredSet(key){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return new Set(Array.isArray(value)?value:[])}catch{return new Set()}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveRead(){try{localStorage.setItem(READ_KEY,JSON.stringify([...readSet]))}catch{}}
const SECTION_DEFS=[['fact','Fact','Fact｜发生了什么','fact'],['why_it_matters','Why','Why it matters｜为什么重要','inference'],['what_is_new','New','What is actually new｜真正新增','inference'],['map_change','Map','Map change｜产业地图变化','inference'],['challenges_existing_assumptions','Challenge','Challenges existing assumptions｜对既有判断的挑战','inference'],['hype_uncertainty','Risk','Hype / uncertainty｜反证与不确定性','risk'],['startup_implications','Startup','Startup implications｜创业含义','inference'],['prediction','Prediction','Prediction｜预测','prediction'],['discussion_question','Question','Discussion question｜讨论问题','prediction']];
function sec(key,label,text,cls='',tone=''){if(!text)return '';return '<section class="section" id="sec-'+key+'" data-key="'+key+'"'+(tone?' data-tone="'+tone+'"':'')+'><h2>'+esc(label)+'</h2><div class="body '+cls+'">'+esc(text)+'</div></section>'}function sourceHtml(s,i){const label=typeof s==='string'?s:(s&&s.label)||((s&&s.url)||'');const url=typeof s==='string'?s:(s&&s.url)||'';return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener"><span class="source-index">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(label)+'</span></a>':''}
function estimateMinutes(e){const text=['deck',...SECTION_DEFS.map(x=>x[0])].map(k=>e[k]||'').join('');const cjk=(text.match(/[\u3400-\u9fff]/g)||[]).length;const latin=(text.match(/[A-Za-z0-9]+/g)||[]).length;return Math.max(1,Math.round(cjk/450+latin/220))}
function showToast(text){toast.textContent=text;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),1500)}
function render(e){currentItem=e;const themes=(e.themes||[]).join(' · '),sources=(e.sources||[]).map(sourceHtml).filter(Boolean).join(''),sourceCount=(e.sources||[]).length,minutes=estimateMinutes(e);const sectionCount=SECTION_DEFS.filter(([k])=>e[k]).length+(sourceCount?1:0);document.title=e.title+' · VELNAR Intelligence Radar';const canonical=location.origin+location.pathname+'?id='+encodeURIComponent(e.id);canonicalLink.href=canonical;document.querySelector('meta[property="og:title"]').content=e.title+' · VELNAR Intelligence Radar';document.querySelector('meta[property="og:description"]').content=e.deck||'Long-form AI industry analysis';articleRoot.innerHTML='<article class="article"><div class="hero-block"><div class="kicker"><span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span><span class="meta">'+esc(e.date)+' · '+esc(e.id)+'</span></div><h1>'+esc(e.title)+'</h1>'+(themes?'<div class="themes">'+esc(themes)+'</div>':'')+(e.deck?'<div class="deck">'+esc(e.deck)+'</div>':'')+'<div class="reading-meta"><span>约 '+minutes+' 分钟阅读</span><span class="dot">·</span><span>'+sectionCount+' 个章节</span>'+(sourceCount?'<span class="dot">·</span><span>'+sourceCount+' 个来源</span>':'')+'</div></div>'+SECTION_DEFS.map(([k,,label,tone])=>sec(k,label,e[k],k==='discussion_question'?'question':'',tone)).join('')+(sources?'<section class="section" id="sec-sources" data-key="sources"><h2>Sources｜来源</h2><div class="sources">'+sources+'</div></section>':'')+'</article>';buildToc(e,sourceCount);buildArchiveNav(e);updateProgress();restoreHash()}
function buildToc(e,sourceCount){const defs=SECTION_DEFS.filter(([k])=>e[k]).map(([k,short])=>[k,short]);if(sourceCount)defs.push(['sources','Sources']);if(defs.length<2){tocShell.classList.remove('visible');return}toc.innerHTML=defs.map(([k,short])=>'<a class="toc-link" href="#sec-'+k+'" data-key="'+k+'">'+short+'</a>').join('');tocShell.classList.add('visible');observeSections()}
function observeSections(){if(observer)observer.disconnect();const sections=[...document.querySelectorAll('.section[data-key]')];observer=new IntersectionObserver(entries=>{const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(!visible)return;const key=visible.target.dataset.key;document.querySelectorAll('.toc-link').forEach(a=>a.classList.toggle('active',a.dataset.key===key));const active=document.querySelector('.toc-link.active');if(active)active.scrollIntoView({block:'nearest',inline:'center'})},{rootMargin:'-15% 0px -70% 0px',threshold:0});sections.forEach(s=>observer.observe(s))}
function buildArchiveNav(e){const sorted=[...allItems].sort((a,b)=>b.date.localeCompare(a.date)||({S:0,A:1,B:2}[a.grade]-{S:0,A:1,B:2}[b.grade]));const i=sorted.findIndex(x=>x.id===e.id),newer=i>0?sorted[i-1]:null,older=i>=0&&i<sorted.length-1?sorted[i+1]:null;const card=(x,label)=>x?'<a class="archive-link" href="./article.html?id='+encodeURIComponent(x.id)+'"><span class="archive-label">'+label+'</span><span class="archive-title">'+esc(x.title)+'</span><span class="archive-meta">'+esc(x.date)+' · '+esc(x.grade)+'</span></a>':'<span class="archive-link empty"></span>';archiveNav.innerHTML=card(newer,'较新一篇')+card(older,'较早一篇')}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight,ratio=max>0?Math.min(1,Math.max(0,scrollY/max)):0;progressBar.style.transform='scaleX('+ratio+')';toTop.classList.toggle('visible',scrollY>700);progressTick=false}function requestProgress(){if(!progressTick){progressTick=true;requestAnimationFrame(updateProgress)}}function restoreHash(){if(location.hash){const el=document.querySelector(location.hash);if(el)setTimeout(()=>el.scrollIntoView(),60)}}
stateBtn.addEventListener('click',()=>{if(!id)return;if(readSet.has(id)){readSet.delete(id);stateBtn.textContent='已标记未读';showToast('已标记未读')}else{readSet.add(id);stateBtn.textContent='标记未读';showToast('已恢复已读')}saveRead()});shareBtn.addEventListener('click',async()=>{const data={title:currentItem?currentItem.title:'VELNAR Intelligence Radar',text:currentItem&&currentItem.deck?currentItem.deck:'AI Industry Signals & Strategic Analysis',url:location.href};if(navigator.share){try{await navigator.share(data);return}catch(err){if(err&&err.name==='AbortError')return}}try{await navigator.clipboard.writeText(location.href);showToast('文章链接已复制')}catch{showToast('请复制浏览器地址')}});toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',requestProgress,{passive:true});addEventListener('resize',requestProgress);
async function load(){if(!id){articleRoot.innerHTML='<div class="error">缺少文章 ID。</div>';return}readSet.add(id);saveRead();try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();allItems=data.items||[];const e=allItems.find(x=>x.id===id);if(!e)throw new Error('未找到该文章');render(e)}catch(err){articleRoot.innerHTML='<div class="error">文章加载失败：'+esc(err.message)+'</div>'}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));load();
