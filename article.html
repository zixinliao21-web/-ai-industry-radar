<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VELNAR Intelligence Radar — long-form AI industry analysis">
<meta name="theme-color" content="#f3f4f7">
<title>VELNAR Intelligence Radar</title>
<link rel="icon" href="./assets/velnar-symbol.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f4f7;--card:#fff;--text:#111214;--muted:#777983;--line:#e3e5ea;--line-strong:#d7d9e1;--soft:#f7f7f9;--brand:#080c43;--accent:#396ee3;--reading:660px;
  --ease-velnar:cubic-bezier(.23,1,.32,1);--dur-press:120ms;--dur-hover:160ms;--dur-state:220ms;--dur-brand:560ms;
}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}
button{font-family:inherit}.skip-link{position:fixed;left:14px;top:10px;z-index:1200;transform:translateY(-140%);background:#111;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;text-decoration:none;transition:transform var(--dur-state) var(--ease-velnar)}.skip-link:focus{transform:translateY(0)}
.progress-track{position:fixed;top:0;left:0;right:0;height:2px;z-index:1100;background:transparent;pointer-events:none}.progress-bar{width:100%;height:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#1daace 0%,#396ee3 48%,#6b42ea 100%);will-change:transform}
main{max-width:900px;margin:0 auto;padding:22px 16px 80px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;opacity:0;transform:translateY(4px);animation:brandIn var(--dur-brand) var(--ease-velnar) 60ms forwards}.brandlock{display:flex;align-items:center;gap:9px}.brandmark{width:28px;height:28px;display:block;transform:scale(.96);animation:markIn var(--dur-brand) var(--ease-velnar) 60ms forwards}.brandname{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand)}.product{font-size:11px;color:var(--muted);margin-left:2px}.mode{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8b8d95}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.top-actions{display:flex;align-items:center;gap:8px}.control{border:1px solid var(--line);background:rgba(255,255,255,.9);color:#26272d;border-radius:999px;padding:9px 13px;font:inherit;font-size:12px;text-decoration:none;cursor:pointer;transition:background var(--dur-hover) ease,transform var(--dur-hover) var(--ease-velnar),border-color var(--dur-hover) ease;outline:none;white-space:nowrap}.control:active{transform:scale(.985)}.control:focus-visible,.sources a:focus-visible,.archive-link:focus-visible,.toc-link:focus-visible,.to-top:focus-visible{box-shadow:0 0 0 3px rgba(57,110,227,.18),0 0 0 1px rgba(57,110,227,.55);outline:none}
.toc-shell{position:sticky;top:8px;z-index:50;margin-bottom:14px;display:none}.toc-shell.visible{display:block}.toc{display:flex;gap:16px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:11px 14px;background:rgba(248,249,251,.88);border:1px solid rgba(222,224,230,.92);border-radius:14px;backdrop-filter:blur(14px) saturate(130%)}.toc::-webkit-scrollbar{display:none}.toc-link{position:relative;flex:0 0 auto;color:#858791;text-decoration:none;font-size:10.5px;line-height:1;letter-spacing:.02em;padding:2px 0;outline:none;transition:color var(--dur-hover) ease}.toc-link::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform var(--dur-state) var(--ease-velnar)}.toc-link.active{color:#272933}.toc-link.active::after{transform:scaleX(1)}
.article{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:36px 36px 46px;box-shadow:0 1px 0 rgba(17,18,20,.02)}.article>*{max-width:var(--reading);margin-left:auto;margin-right:auto}.hero-block{padding-bottom:26px;border-bottom:1px solid var(--line)}.kicker{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#111;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}.grade.A{background:#4b4e58}.grade.B{background:#8d9099}.meta{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}.article h1{font-size:clamp(34px,5vw,48px);line-height:1.08;letter-spacing:-1.45px;margin:0 0 12px;text-wrap:balance}.themes{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 4px;letter-spacing:.01em}.deck{font-size:17px;line-height:1.72;color:#383a42;margin:20px 0 0;text-wrap:pretty}.reading-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px;color:#8b8d95;font-size:10.5px;font-variant-numeric:tabular-nums}.reading-meta .dot{opacity:.45}
.section{padding-top:34px;scroll-margin-top:76px}.section h2{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#646670;margin:0 0 14px;font-weight:800}.section h2::before{content:"";display:block;width:18px;height:1px;background:#b9bbc3}.body{font-size:16px;line-height:1.92;color:#25262c;white-space:pre-line;text-wrap:pretty}.body strong{font-weight:680}.section[data-tone="fact"] h2{color:#34445f}.section[data-tone="inference"] h2{color:#4e4d62}.section[data-tone="risk"] h2{color:#65514a}.section[data-tone="prediction"] h2{color:#4c5264}.question{background:#f5f6f8;border:1px solid #eceef2;border-radius:14px;padding:18px;line-height:1.8}.sources{display:grid;gap:10px}.sources a{display:flex;align-items:flex-start;gap:6px;padding:10px 0;border-bottom:1px solid #eceef2;color:#24262c;text-decoration:none;font-size:14px;line-height:1.55;transition:color var(--dur-hover) ease,transform var(--dur-hover) var(--ease-velnar)}.sources a:last-child{border-bottom:0}.source-index{flex:0 0 28px;color:#9698a0;font-size:10px;font-variant-numeric:tabular-nums;padding-top:2px}.legacy{font-size:13px;line-height:1.65;color:var(--muted);background:#f8f8f9;padding:13px 14px;border-radius:12px;margin-top:22px}.error{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;color:#666}
.archive-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.archive-link{display:flex;flex-direction:column;justify-content:space-between;min-height:112px;padding:16px 17px;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:16px;text-decoration:none;outline:none;transition:background var(--dur-hover) ease,transform var(--dur-hover) var(--ease-velnar),border-color var(--dur-hover) ease}.archive-link.empty{visibility:hidden}.archive-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#90929a}.archive-title{margin-top:18px;font-size:13px;line-height:1.45;font-weight:650;color:#2c2e35;text-wrap:pretty}.archive-meta{margin-top:7px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.footerbrand{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:28px;color:#8a8c94;font-size:10px;letter-spacing:.08em}.footerbrand img{width:18px;height:18px;opacity:.9}.to-top{position:fixed;right:22px;bottom:22px;z-index:60;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.92);color:#454750;font-size:16px;cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--dur-state) ease,transform var(--dur-state) var(--ease-velnar),background var(--dur-hover) ease;backdrop-filter:blur(10px)}.to-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:9px 12px;border-radius:999px;background:#15161a;color:#fff;font-size:11px;box-shadow:0 6px 24px rgba(0,0,0,.14);transition:opacity var(--dur-state) ease,transform var(--dur-state) var(--ease-velnar)}.toast.visible{opacity:1;transform:translate(-50%,0)}
@keyframes brandIn{to{opacity:1;transform:translateY(0)}}@keyframes markIn{to{transform:scale(1)}}
@media(hover:hover) and (pointer:fine){.control:hover{background:#fff;transform:translateY(-1px);border-color:var(--line-strong)}.sources a:hover{color:#111;transform:translateX(2px)}.archive-link:hover{background:#fff;transform:translateY(-2px);border-color:var(--line-strong)}.to-top:hover{background:#fff}}
@media(max-width:640px){main{padding:14px 10px 52px}.brandbar{margin:2px 4px 18px}.mode,.product{display:none}.topbar{align-items:flex-start}.top-actions{gap:6px}.control{padding:8px 10px;font-size:11px}.article{padding:24px 18px 32px;border-radius:19px}.article h1{font-size:31px;line-height:1.14;letter-spacing:-.8px}.body{font-size:15.5px;line-height:1.88}.deck{font-size:15.5px;line-height:1.72}.section{padding-top:29px}.hero-block{padding-bottom:22px}.toc-shell{top:5px}.toc{border-radius:12px;padding:10px 12px;gap:14px}.archive-nav{grid-template-columns:1fr}.archive-link.empty{display:none}.to-top{right:14px;bottom:14px}.toast{bottom:18px;max-width:calc(100vw - 28px);white-space:nowrap}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.brandbar,.brandmark,.control,.sources a,.skip-link,.archive-link,.toc-link,.toc-link::after,.to-top,.toast{animation:none!important;transition:none!important;transform:none!important}.brandbar{opacity:1}.progress-bar{will-change:auto}.to-top.visible,.toast.visible{opacity:1}}
</style>
</head>
<body>
<a class="skip-link" href="#articleRoot">跳到文章</a>
<div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
<main>
  <div class="brandbar"><div class="brandlock"><img class="brandmark" src="./assets/velnar-symbol.svg" alt="VELNAR"><span class="brandname">VELNAR</span><span class="product">Intelligence Radar</span></div><span class="mode">Research note</span></div>
  <div class="topbar"><a class="control" href="./index.html">← 返回目录</a><div class="top-actions"><button class="control" id="shareBtn" type="button">分享</button><button class="control" id="stateBtn" type="button">标记未读</button></div></div>
  <div class="toc-shell" id="tocShell"><nav class="toc" id="toc" aria-label="文章章节"></nav></div>
  <div id="articleRoot"></div>
  <nav class="archive-nav" id="archiveNav" aria-label="文章前后导航"></nav>
  <div class="footerbrand"><img src="./assets/velnar-symbol.svg" alt=""><span>VELNAR · INTELLIGENCE RADAR</span></div>
</main>
<button class="to-top" id="toTop" type="button" aria-label="返回顶部">↑</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const READ_KEY='ai-industry-radar-read-v1';const id=new URLSearchParams(location.search).get('id');
function parseStoredSet(key){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return new Set(Array.isArray(value)?value:[])}catch{return new Set()}}
let readSet=parseStoredSet(READ_KEY);let progressTick=false;let observer=null;let currentItem=null;let allItems=[];let toastTimer=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveRead(){try{localStorage.setItem(READ_KEY,JSON.stringify([...readSet]))}catch{}}
const SECTION_DEFS=[['fact','Fact','Fact｜发生了什么','fact'],['why_it_matters','Why','Why it matters｜为什么重要','inference'],['what_is_new','New','What is actually new｜真正新增','inference'],['map_change','Map','Map change｜产业地图变化','inference'],['challenges_existing_assumptions','Challenge','Challenges existing assumptions｜对既有判断的挑战','inference'],['hype_uncertainty','Risk','Hype / uncertainty｜反证与不确定性','risk'],['startup_implications','Startup','Startup implications｜创业含义','inference'],['prediction','Prediction','Prediction｜预测','prediction'],['discussion_question','Question','Discussion question｜讨论问题','prediction']];
function sec(key,label,text,cls='',tone=''){if(!text)return '';return '<section class="section" id="sec-'+key+'" data-key="'+key+'"'+(tone?' data-tone="'+tone+'"':'')+'><h2>'+esc(label)+'</h2><div class="body '+cls+'">'+esc(text)+'</div></section>'}
function sourceHtml(s,i){const label=typeof s==='string'?s:(s&&s.label)||((s&&s.url)||'');const url=typeof s==='string'?s:(s&&s.url)||'';if(!url)return '';return '<a href="'+esc(url)+'" target="_blank" rel="noopener"><span class="source-index">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(label)+'</span></a>'}
function estimateMinutes(e){const fields=['deck',...SECTION_DEFS.map(x=>x[0])];const text=fields.map(k=>e[k]||'').join('');const cjk=(text.match(/[\u3400-\u9fff]/g)||[]).length;const latin=(text.match(/[A-Za-z0-9]+/g)||[]).length;return Math.max(1,Math.round(cjk/450+latin/220))}
function showToast(message){toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),1800)}
function setReadState(isRead){if(!id)return;if(isRead){readSet.add(id);stateBtn.textContent='标记未读'}else{readSet.delete(id);stateBtn.textContent='标记已读'}saveRead();stateBtn.dataset.read=isRead?'1':'0'}
function buildToc(e,hasSources){const available=SECTION_DEFS.filter(([key])=>e[key]).map(([key,short])=>[key,short]);if(hasSources)available.push(['sources','Sources']);if(available.length<3){tocShell.classList.remove('visible');return}toc.innerHTML=available.map(([key,short])=>'<a class="toc-link" href="#sec-'+key+'" data-key="'+key+'">'+esc(short)+'</a>').join('');tocShell.classList.add('visible');setupSectionObserver()}
function setupSectionObserver(){if(observer)observer.disconnect();const sections=[...document.querySelectorAll('.section[id]')];const links=[...document.querySelectorAll('.toc-link')];if(!sections.length)return;observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const key=visible[0].target.dataset.key;links.forEach(l=>l.classList.toggle('active',l.dataset.key===key));const active=links.find(l=>l.dataset.key===key);if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})},{rootMargin:'-78px 0px -68% 0px',threshold:[0,.15,.5]});sections.forEach(s=>observer.observe(s))}
function render(e){currentItem=e;document.title=e.title+' · VELNAR Intelligence Radar';const themes=(e.themes||[]).join(' · ');const sourceArray=e.sources||[];const sources=sourceArray.map(sourceHtml).filter(Boolean).join('');const hasSources=Boolean(sources);const hasDeep=e.map_change||e.challenges_existing_assumptions||e.startup_implications||e.prediction;const minutes=estimateMinutes(e);const sectionCount=SECTION_DEFS.filter(([key])=>e[key]).length+(hasSources?1:0);articleRoot.innerHTML='<article class="article"><div class="hero-block"><div class="kicker"><span class="grade '+esc(e.grade)+'">'+esc(e.grade)+'</span><span class="meta">'+esc(e.date)+' · '+esc(e.id)+'</span></div><h1>'+esc(e.title)+'</h1>'+(themes?'<div class="themes">'+esc(themes)+'</div>':'')+(e.deck?'<div class="deck">'+esc(e.deck)+'</div>':'')+'<div class="reading-meta"><span>约 '+minutes+' 分钟阅读</span><span class="dot">·</span><span>'+sectionCount+' 个章节</span>'+(sourceArray.length?'<span class="dot">·</span><span>'+sourceArray.length+' 个来源</span>':'')+'</div></div>'+SECTION_DEFS.map(([key,,label,tone])=>sec(key,label,e[key],key==='discussion_question'?'question':'',tone)).join('')+(hasSources?'<section class="section" id="sec-sources" data-key="sources"><h2>Sources｜来源</h2><div class="sources">'+sources+'</div></section>':'')+(!hasDeep&&!e.what_is_new&&!e.hype_uncertainty&&!e.discussion_question?'<div class="legacy">历史迁移条目目前只保存了摘要。后续新文章会使用完整深度结构。</div>':'')+'</article>';buildToc(e,hasSources);renderArchiveNav();requestProgress();if(location.hash){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView(),0)}}
function sortedItems(){return [...allItems].sort((a,b)=>b.date.localeCompare(a.date)||({S:0,A:1,B:2}[a.grade]-{S:0,A:1,B:2}[b.grade]))}
function navCard(item,label){if(!item)return '<span class="archive-link empty" aria-hidden="true"></span>';return '<a class="archive-link" href="./article.html?id='+encodeURIComponent(item.id)+'"><span class="archive-label">'+label+'</span><span class="archive-title">'+esc(item.title)+'</span><span class="archive-meta">'+esc(item.date)+' · '+esc(item.grade)+'</span></a>'}
function renderArchiveNav(){const sorted=sortedItems();const i=sorted.findIndex(x=>x.id===id);if(i<0){archiveNav.innerHTML='';return}const newer=i>0?sorted[i-1]:null;const older=i<sorted.length-1?sorted[i+1]:null;archiveNav.innerHTML=navCard(newer,'较新一篇')+navCard(older,'较早一篇')}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight;const ratio=max>0?Math.min(1,Math.max(0,window.scrollY/max)):0;progressBar.style.transform='scaleX('+ratio+')';toTop.classList.toggle('visible',window.scrollY>700);progressTick=false}function requestProgress(){if(!progressTick){progressTick=true;requestAnimationFrame(updateProgress)}}
stateBtn.addEventListener('click',()=>setReadState(stateBtn.dataset.read!=='1'));
shareBtn.addEventListener('click',async()=>{const shareData={title:currentItem?currentItem.title:'VELNAR Intelligence Radar',text:currentItem?.deck||'',url:location.href};try{if(navigator.share){await navigator.share(shareData)}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);showToast('链接已复制')}else{showToast('请复制浏览器地址栏链接')}}catch(err){if(err&&err.name!=='AbortError')showToast('分享失败，请复制链接')}});
toTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));window.addEventListener('scroll',requestProgress,{passive:true});window.addEventListener('resize',requestProgress);
async function load(){if(!id){articleRoot.innerHTML='<div class="error">缺少文章 ID。</div>';return}setReadState(true);try{const r=await fetch('./news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();allItems=data.items||[];const e=allItems.find(x=>x.id===id);if(!e)throw new Error('未找到该文章');render(e)}catch(err){articleRoot.innerHTML='<div class="error">文章加载失败：'+esc(err.message)+'</div>';tocShell.classList.remove('visible')}}load();
</script>
</body>
</html>
